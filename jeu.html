<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeu — Atlas Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head><body data-page="jeu">
<article class="content" data-nopager>
<div id="game"></div>
<div class="game-how" id="howto"></div>
<p class="small muted" style="text-align:center">Astuce : sur ordinateur, le jeu se joue aussi au clavier (espace, flèches) quand c’est indiqué.</p>
<h2 id="autres" data-nomaster>Les autres jeux de la matière</h2>
<div class="arcade-grid" id="others"></div>
</article>
<script src="js/games-core.js"></script><script src="js/games-kinds.js"></script><script src="js/games-data.js"></script><script src="js/games-elec.js"></script><script src="js/games-phys.js"></script><script src="js/games-maths.js"></script><script src="js/app.js"></script>
<script>
(function(){ const id=new URLSearchParams(location.search).get('g')||'ma1'; const G=window.ATLAS_GAMES; const me=G.find(g=>g.id===id)||G[0]; const LS=window.EM_LS;
 const art=document.querySelector('article.content'); const k=document.createElement('div'); k.className='kicker'; k.textContent='Arcade · '+({phys:'Physique',elec:'Électronique',math:'Maths'})[me.s]+' · chapitre '+me.ch.replace(/^(ch|el|ma)/,'');
 const h=document.createElement('h1'); h.textContent=me.ico+' '+me.t; const p=document.createElement('p'); p.className='lead'; p.textContent=me.d; art.prepend(k,h,p);
 const kinds={visual:['🎯 But','Réponds avant la fin de la barre de temps : plus tu es rapide, plus tu marques.'],field:['🎯 But','Clique sur le terrain pour poser des charges, puis lance. Vies illimitées : moins d’essais = plus de points.'],tuner:['🎯 But','Bouge les curseurs jusqu’à ce que la bille soit dans la zone verte, puis valide.'],bfield:['🎯 But','Choisis ⊙ ou ⊗ et l’intensité de B, puis tire. Le rayon suit R = mv/(|q|B).'],timing:['🎯 But','Appuie sur STOP (ou espace) au bon instant. ±6 % = parfait.'],matcher:['🎯 But','Règle les curseurs : quand la ressemblance dépasse le seuil, c’est verrouillé.'],rotor:['🎯 But','Joue des cartes (opérations) pour amener z sur la cible en un minimum de coups.'],catch:['🎯 But','Déplace le panier (souris, doigt ou ← →) sous la bonne formule.'],gauss:['🎯 But','Clique la ligne à modifier, puis la ligne pivot, puis choisis k.'],circuit:['🎯 But','Clique les emplacements ?, choisis une résistance (ou un fil), puis « Mettre sous tension ». Les mesures s’affichent sur le schéma.'],capshoot:['🎮 Commandes','Souris ou ← → pour bouger, clic ou espace pour tirer, touches 1 2 3 pour changer R.'],filterdef:['🎮 Commandes','Touches 1 à 4 : type de filtre. Glisse sur le diagramme de Bode (ou ← →) pour déplacer fc.'],opamp:['🎮 Commandes','S, I, N, C : montage. ↑ ↓ : rapport R₂/R₁. Ou les boutons sous le jeu.'],fog:['🎮 Commandes','Maintiens la souris (ou le doigt) pour voler vers un point, ou flèches du clavier.'],crt:['🎮 Commandes','↑ ↓ : ±1 V, PgUp/PgDn : ±5 V, espace : tirer. Ou les boutons.'],dynamo:['🎮 Commandes','Fais glisser l’aimant à la souris (ou ← →).'],radio:['🎮 Commandes','↑ ↓ : longueur de l’antenne, R : la tourner.'],susp:['🎮 Commandes','↑ ↓ : amortissement λ, ← → : pulsation propre ω₀.'],slicer:['🎮 Commandes','Glisse la souris (bouton enfoncé) ou le doigt à travers le bon domaine.'],harmdef:['🎮 Commandes','Touches 2 à 9 (ou boutons) pour tirer sur l’harmonique de ce rang.'],uncert:['🎮 Commandes','↑ ↓ : durée a, ← → : retard t₀.']};
 const d=window.GDEFS[id]; const kd=kinds[d.kind]; document.getElementById('howto').innerHTML=`<div><b>${kd[0]}</b>${kd[1]}</div><div><b>📚 Ce que tu travailles</b>${d.outro}</div><div><b>📖 Le cours</b><a href="${me.ch}.html">Revoir le chapitre correspondant →</a></div>`;
 document.getElementById('others').innerHTML=G.filter(g=>g.s===me.s&&g.id!==me.id).map(g=>{ const r=LS.get('game:'+g.id,{stars:0}); return `<a class="acard s-${g.s}" href="jeu.html?g=${g.id}"><span class="ai">${g.ico}</span><b>${g.t}</b><small>${g.d}</small><span class="astars">${'★'.repeat(r.stars||0)}<span style="opacity:.35">${'★'.repeat(3-(r.stars||0))}</span></span></a>`; }).join('');
})();
</script>
</body></html>
